<app-habitacion-component
    [id]="1"
    [hayCorriente]="corrienteVivienda && corrienteHabitacion"
    (estadoCambiado)="onEstadoPersiana($event)">
</app-habitacion-component>

<div class="cuadro">
    <h1>Control de vivienda</h1>

    <div class="carril">
        <button class="breaker general" [class.on]="corrienteVivienda" (click)="onConectDisconect()">
            <span class="palanca" aria-hidden="true"></span>
            <span class="texto">{{ corrienteVivienda ? 'Desconectar' : 'Conectar' }} corriente vivienda</span>
        </button>
        <button class="breaker" [class.on]="corrienteHabitacion" (click)="onConectDisconectHabitacion()">
            <span class="palanca" aria-hidden="true"></span>
            <span class="texto">{{ corrienteHabitacion ? 'Desconectar' : 'Conectar' }} corriente Hab #1</span>
        </button>
    </div>

    <div class="boton-leyenda" [class.conectada]="corrienteVivienda">
        <span>Corriente general: {{ corrienteVivienda ? 'CONECTADA' : 'DESCONECTADA' }}</span>
    </div>

    <div class="boton-leyenda" [class.conectada]="corrienteHabitacion">
        <span>Corriente Hab #1: {{ corrienteHabitacion ? 'CONECTADA' : 'DESCONECTADA' }}</span>
    </div>

    <p class="estado-recibido" [class.abierta]="estadoPersiana">
        Estado recibido: PERSIANA {{ estadoPersiana ? 'ABIERTA' : 'CERRADA' }}
    </p>
</div>
